[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "vla-scenegraph"
version = "0.1.0"
description = "Reproducible VLA baselines and scene graph experiments"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8,<9", "ruff>=0.11,<1", "numpy>=1.24,<3",
    "imageio>=2.34,<2.36", "imageio-ffmpeg>=0.5,<0.7",
]

[project.scripts]
sgvla = "sgvla.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sgvla"]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
